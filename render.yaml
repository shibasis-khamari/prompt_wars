services:
  - type: web
    name: bug-hunt-arena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: bughunt_arena
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GENERATION_USER_DAILY_CAP
        value: "20"
      - key: GENERATION_GLOBAL_DAILY_CAP
        value: "100"
      - key: GENERATION_IP_RATE_LIMIT
        value: "5"
